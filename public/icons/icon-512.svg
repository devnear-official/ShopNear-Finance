<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Inner Subtle Glow -->
  <circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.08" />
  <!-- Taka Symbol (৳) in crisp vector -->
  <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle">৳</text>
  <!-- Bottom Fin accent pill -->
  <rect x="186" y="375" width="140" height="14" rx="7" fill="#a7f3d0" />
</svg>
